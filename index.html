<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport & basic meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Siena — a complete wellness platform for individuals and couples." />
    <meta name="format-detection" content="telephone=no" />

    <!-- App title -->
    <title>Siena - Therapeutic Journey Platform</title>

    <!-- Fonts -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <!-- Favicon (browser tab) -->
    <link
      rel="icon"
      type="image/png"
      href="https://static.wixstatic.com/media/4e16d8_432d7efa6b384409b66ee29d3d7f541e~mv2.png"
    />

    <!-- PWA: Web App Manifest (Android/Chrome) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA: theme colors -->
    <meta name="theme-color" content="#01B1AF" />
    <meta name="color-scheme" content="light only" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS: Add to Home Screen icon + PWA hints -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="https://static.wixstatic.com/media/4e16d8_463e5d082c8645e58e63b0236e755d1b~mv2.png"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Siena" />
  </head>

  <body class="bg-[#03274B] overflow-x-hidden m-0 p-0">
    <div id="root" class="min-h-screen flex flex-col"></div>

    <!-- Vite/React entry -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- iOS standalone launch → force /login (iOS ignores manifest start_url) -->
    <script>
      (function () {
        const isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true; // iOS Safari

        if (isStandalone) {
          const target = '/login';
          if (location.pathname !== target) {
            location.replace(target);
          }
        }
      })();
    </script>
  </body>
</html>
