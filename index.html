<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport & basic meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Siena — a complete wellness platform for individuals and couples." />
    <meta name="format-detection" content="telephone=no" />

    <!-- App title -->
    <title>Siena - Therapeutic Journey Platform</title>

    <!-- Fonts -->
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />

    <!-- Link-share preview (WhatsApp, iMessage, Slack, X…).
         Absolute URLs are required: scrapers do not resolve relative paths.
         The ?v= query busts the aggressive preview caches those clients keep.
         This is a SPA (/* rewrites to index.html), so /invite and every other
         route share this one static tag set. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Siena" />
    <meta property="og:url" content="https://hellosiena.com/" />
    <meta property="og:title" content="Siena — Heal, Evolve, Connect" />
    <meta
      property="og:description"
      content="A complete wellness platform for individuals and couples."
    />
    <meta property="og:image" content="https://hellosiena.com/og-image.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Siena" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Siena — Heal, Evolve, Connect" />
    <meta
      name="twitter:description"
      content="A complete wellness platform for individuals and couples."
    />
    <meta name="twitter:image" content="https://hellosiena.com/og-image.png?v=3" />

    <!-- Favicon (browser tab) -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- PWA: Web App Manifest (Android/Chrome) -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- PWA: theme colors -->
    <meta name="theme-color" content="#01B1AF" />
    <meta name="color-scheme" content="light only" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS: Add to Home Screen icon + PWA hints -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Siena" />
  </head>

  <body class="bg-[#03274B] overflow-x-hidden m-0 p-0">
    <div id="root" class="min-h-screen flex flex-col"></div>

    <!-- Vite/React entry -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- iOS standalone launch → force /login (iOS ignores manifest start_url) -->
    <script>
      (function () {
        const isStandalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.navigator.standalone === true; // iOS Safari

        if (isStandalone) {
          const target = '/login';
          if (location.pathname !== target) {
            location.replace(target);
          }
        }
      })();
    </script>
  </body>
</html>
